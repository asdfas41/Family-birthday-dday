
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Birthday D-Day</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>🎂 FAMILY BIRTHDAY</h1>
        <p>우리 가족의 특별한 날까지!</p>

        <div id="today"></div>

        <section class="birthday-card mom">
            <h2>👩 엄마 생일</h2>
            <p>2월 12일</p>
            <div id="momDday">계산 중...</div>
        </section>

        <section class="birthday-card dad">
            <h2>👨 아빠 생일</h2>
            <p>6월 27일</p>
            <div id="dadDday">계산 중...</div>
        </section>

        <section class="message-section">
            <h2>💬 엄마 생일 2월12일 아빠 생일 6월27일</h2>
            <textarea id="customMessage">소중한 가족의 생일을 기다리는 중 ❤️</textarea>
        </section>

        <button id="copyButton">📋 생일 D-Day 문구 복사</button>

        <p id="copyText"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
